# Publishes to PyPI via Trusted Publishing (OIDC — no API tokens).
# Trigger: the maintainer publishes a GitHub Release (the human click is the gate).
# One-time PyPI setup: Account → Publishing → add pending publisher
#   project=vouchkit · owner=vouchkit · repository=vouchkit ·
#   workflow=release.yml · environment=pypi

name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Run tests
        run: uv run --group dev pytest -q
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
